    <script>
      (function (l) {
        if (l.search[1] === "/" && l.search[0] === "?") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");

          var pathname = l.pathname;
          if (!pathname.endsWith("/") && pathname.split("/").length <= 3) {
            pathname += "/";
          }

          window.history.replaceState(
            null,
            null,
            (pathname.endsWith("/") ? pathname.slice(0, -1) : pathname) +
              decoded +
              l.hash
          );
        }
      })(window.location);
